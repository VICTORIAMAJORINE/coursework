<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration Form</title>
  <link rel="stylesheet" href="form.css">
</head>
<body>

  <main class="form-container">
    <header class="form-title">
      <h1>Student Registration Form</h1>
    </header>

    <form action="#" method="post">
      
      <div class="row">
        <label for="name">Name :</label>
        <input type="text" id="name" name="name" placeholder="Enter full name" required>
      </div>

      <div class="row">
        <label for="father">Father's Name :</label>
        <input type="text" id="father" name="father_name">
      </div>

      <div class="row">
        <label for="mother">Mother's Name :</label>
        <input type="text" id="mother" name="mother_name">
      </div>

      <div class="row">
        <label for="phone">Phone Number :</label>
        <input type="tel" id="phone" name="phone" placeholder="017xxxxxxxx">
      </div>

      <div class="row">
        <label for="email">Email :</label>
        <input type="email" id="email" name="email" placeholder="sample@example.com">
      </div>

      <div class="row">
        <span class="label">Gender :</span>
        <div class="options">
          <label><input type="radio" name="gender" value="male"> Male</label>
          <label><input type="radio" name="gender" value="female"> Female</label>
          <label><input type="radio" name="gender" value="other"> Other</label>
        </div>
      </div>

      <div class="row">
        <span class="label">Date Of Birth :</span>
        <div class="dob">
          <input type="text" placeholder="" aria-label="Day"> -
          <input type="text" aria-label="Month"> -
          <input type="text" aria-label="Year">
          <span class="hint"><i>(dd-mm-yyyy)</i></span>
        </div>
      </div>

      <div class="row">
        <label for="address">Address :</label>
        <input type="text" id="address" name="address" placeholder="Street: - House: - Road: -">
      </div>

      <div class="row">
        <label for="blood">Blood Group :</label>
        <select id="blood" name="blood_group">
          <option>Select</option>
          <option>A+</option>
          <option>A-</option>
          <option>B+</option>
          <option>B-</option>
          <option>O+</option>
          <option>O-</option>
          <option>AB+</option>
          <option>AB-</option>
        </select>
      </div>

      <div class="row">
        <span class="label">Department :</span>
        <div class="options">
          <label><input type="radio" name="department" value="CSE"> CSE</label>
          <label><input type="radio" name="department" value="EEE"> EEE</label>
          <label><input type="radio" name="department" value="BBA"> BBA</label>
        </div>
      </div>

      <div class="row">
        <span class="label">Course :</span>
        <div class="options">
          <label><input type="checkbox" name="course" value="C"> C</label>
          <label><input type="checkbox" name="course" value="C++"> C++</label>
          <label><input type="checkbox" name="course" value="Java"> Java</label>
          <label><input type="checkbox" name="course" value="AI"> AI</label>
          <label><input type="checkbox" name="course" value="Machine learning"> Machine learning</label>
          <label><input type="checkbox" name="course" value="Robotics"> Robotics</label>
        </div>
      </div>

      <div class="row">
        <label for="photo">Photo :</label>
        <input type="file" id="photo" name="photo">
      </div>

      <div class="buttons">
        <button type="submit" class="submit-btn">Submit</button>
        <button type="reset" class="reset-btn">Reset</button>
      </div>

    </form>
  </main>

</body>
</html>
